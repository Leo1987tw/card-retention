<style>
    * {
        box-sizing: border-box;
        margin: 0px;
        padding: 0px;
    }

    .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid black;
    }

    .card-board {
        perspective: 400px;
        width: 400px;
        height: 400px;
        margin: 30px;
        cursor: pointer;
    }

    .card {
        position: relative;
        width: 400px;
        height: 400px;
        box-shadow: 0px 10px 25px -5px rgba(0, 0, 0, 0.1), 0px 8px 10px -6px rgba(0, 0, 0, 0.1);
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid black;
        border-radius: 40px;
    }

    .face {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 24px;
        color: white;
        font-size: 3rem;
        border-radius: 40px;
        backface-visibility: hidden;
    }

    .front {
        background-color: pink;
    }

    .back {
        background-color: blue;
        transform: rotateY(180deg);
    }

    button {
        width: 400px;
        height: 100px;
        border: 1px solid black;
        border-radius: 40px;
    }
</style>

<div class="container">
    <div class="card-board" id="vard-board" onclick="flipCard(event)">
        <div class="card" id="card">
            <div class="face front">I am front</div>
            <div class="face back">I am back</div>
        </div>
    </div>

    <button onclick="drawCard()"></button>
</div>

<script>
    const card = document.getElementById('card');

    let degree = 0;

    function flipCard(event){
        card.style.transition = "transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)";

        const rectangle = card.getBoundingClientRect();
        const clickPosition = event.clientX - rectangle.left - rectangle.width / 2;

        if(clickPosition >= 0){
            degree += 180;
        }else {
            degree -= 180;
        }

        card.style.transform = `rotateY(${degree}deg)`;
    }

    card.addEventListener('transitionend', () => {
        card.style.transition = "none";

        degree %= 360;
        card.style.transform = `rotateY(${degree}deg)`;
    })

    function drawCard(){
        card.style.transition = "transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)";

        degree = 0;
        card.style.transform = `rotateY(${degree}deg)`;
    }
</script>
