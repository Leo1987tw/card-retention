<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字抽卡機</title>
    <style>
        :root {
            --primary-color: #6366f1; /* 現代感靛藍色 */
            --bg-color: #f3f4f6;
            --card-front: #ffffff;
            --card-back: #fef08a; /* 淡黃色背面 */
            --text-dark: #1f2937;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 控制抽卡容器的進場與置中 */
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* 3D 翻轉的核心舞台 */
        .flashcard-stage {
            perspective: 1000px;
            width: 100%;
            height: 350px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        /* 卡片本體 */
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
        }

        /* 觸發翻牌的 Class (透過 JavaScript 切換) */
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        /* 正反面的共通樣式 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        /* 卡片正面（英文） */
        .card-front {
            background-color: var(--card-front);
            color: var(--text-dark);
        }

        .word-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .phonetic {
            color: #6b7280;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        /* 卡片背面（中文與例句） */
        .card-back {
            background-color: var(--card-back);
            color: var(--text-dark);
            transform: rotateY(180deg);
        }

        .word-translation {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .example-sentence {
            font-size: 1rem;
            color: #4b5563;
            line-height: 1.5;
            text-align: left;
        }

        /* 抽卡與互動按鈕 */
        .btn-draw {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
            transition: all 0.2s;
            width: 100%;
        }

        .btn-draw:hover {
            background-color: #4f46e5;
            transform: translateY(-2px);
        }

        .btn-draw:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 3D 卡片區 -->
        <div class="flashcard-stage" onclick="toggleFlip()">
            <div class="flashcard" id="card">
                <!-- 正面 -->
                <div class="card-face card-front">
                    <div class="word-title">Persist</div>
                    <div class="phonetic">/pəˈsɪst/</div>
                    <div style="font-size: 0.9rem; color: #9ca3af;">💡 點擊卡片翻看中文</div>
                </div>
                <!-- 背面 -->
                <div class="card-face card-back">
                    <div class="word-translation">v. 堅持、固執</div>
                    <div class="example-sentence">
                        <strong>例句：</strong><br>
                        She persisted in her studies despite the difficulties.
                    </div>
                </div>
            </div>
        </div>

        <!-- 抽取功能按鈕 -->
        <button class="btn-draw" onclick="drawNewWord()">🎲 隨機抽取新單字</button>
    </div>

    <script>
        const card = document.getElementById('card');

        // 翻轉卡片
        function toggleFlip() {
            card.classList.toggle('is-flipped');
        }

        // 抽取新單字（串接你的後端 API）
        function drawNewWord() {
            // 1. 先強制翻回正面
            card.classList.remove('is-flipped');
            
            // 2. 這裡可以加上非同步 Fetch 請求，去你的後端單字庫拿新資料
            // 3. 更新 DOM 裡面的單字、發音與中文翻譯
            console.log("向後端請求隨機單字...");
        }
    </script>
</body>
</html>
